; Marker registry for the verifier.
;
; Harbor copies tests/ to /tests and runs pytest there, so the marker definitions have to
; travel with the tests. They previously lived in solution/pyproject.toml, which the
; verifier never sees -- the markers were unregistered and `-m artifacts` selected on a
; warning rather than a contract.
[pytest]
markers =
    corpus: requires the ECG corpus (CHAPMAN_ROOT)
    artifacts: grades artefacts produced by a completed run (OUTPUT_DIR)
    slow: takes more than a few seconds
filterwarnings =
    ignore::DeprecationWarning
addopts = --strict-markers
